name: Validate Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for portfolio directory
        run: |
          # Get changed files
          CHANGED_DIRS=$(git diff --name-only origin/main...HEAD | grep -o '^[^/]*' | sort -u)

          echo "Changed directories: $CHANGED_DIRS"

          # Check if new portfolio directory added
          for dir in $CHANGED_DIRS; do
            if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
              echo "✓ Found portfolio directory: $dir"

              # Validate that members.json is updated
              if git diff origin/main...HEAD --name-only | grep -q "members.json"; then
                echo "✓ members.json updated"
              else
                echo "❌ members.json not updated for new portfolio"
                exit 1
              fi
            fi
          done

      - name: Validate members.json syntax
        run: |
          if [ -f "public/data/members.json" ]; then
            npm install -g jsonlint
            jsonlint public/data/members.json
            echo "✓ members.json is valid JSON"
          fi

      - name: Check for node_modules
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "node_modules"; then
            echo "❌ node_modules should not be committed"
            exit 1
          fi
          echo "✓ No node_modules in PR"

      - name: Check for framework source files
        run: |
          BLOCKED_DIRS="vite-project react-project webpack-project"
          for dir in $BLOCKED_DIRS; do
            if git diff --name-only origin/main...HEAD | grep -q "^$dir/"; then
              echo "❌ Source project directory '$dir' should not be committed"
              echo "Please only commit the built static files"
              exit 1
            fi
          done
          echo "✓ No framework source files in PR"

  comment-pr:
    name: Comment on PR
    needs: validate-pr
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Comment success
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ All validation checks passed! Your PR is ready for review.'
            })
